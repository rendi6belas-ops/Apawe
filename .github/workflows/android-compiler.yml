name: Automated Android APK Compiler
on: [push, workflow_dispatch]

jobs:
  compile-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tarik Resource Source Code
        uses: actions/checkout@v3

      - name: 2. Inisialisasi Java Environment Runtime
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Inisialisasi Node.js Engine
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 4. Pasang Android Platform Packager
        run: npm install -g cordova

      - name: 5. Merakit Struktur Utama Android Container
        run: |
          cordova create compiler-space ${{ github.event.repository.name }} "JAM KERJA RIZA SENSEI"
          cd compiler-space
          cordova platform add android
          
      - name: 6. Mengkonfigurasi Manifest & Manifest Engine
        run: |
          cp config.xml compiler-space/config.xml
          rm -rf compiler-space/www/*
          cp "JAM KERJA PRO.html" compiler-space/www/index.html
          if [ -f "icon.png" ]; then
            cp icon.png compiler-space/www/icon.png
          fi

      - name: 7. Mengkompilasi Menjadi APK Resmi & Mengunci Sertifikat Keamanan
        run: |
          cd compiler-space
          cordova build android --device --release -- --packageType=apk

      - name: 8. Mengamankan Berkas Output Kompilasi
        uses: actions/upload-artifact@v3
        with:
          name: Unduh-File-APK-Asli
          path: compiler-space/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk


