<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Jam Kerja Riza Sensei</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS untuk Export & Import ke XLSX Asli -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        select { appearance: none; -webkit-appearance: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Komponen Ikon SVG
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconFolder = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>;

        const App = () => {
            const generateTimeOptions = () => {
                const options = [];
                for (let hour = 8; hour <= 16; hour++) {
                    const h = hour.toString().padStart(2, '0');
                    options.push(`${h}:00`);
                    if (hour < 16) options.push(`${h}:30`);
                }
                return options;
            };

            const TIME_OPTIONS = generateTimeOptions();
            
            // State awal: Pertemuan default di-set isEdited: false (belum diedit)
            const [meetings, setMeetings] = useState([
                { id: Date.now(), label: 'Pertemuan 1', start: '08:00', end: '09:30', isEdited: false }
            ]);
            const [rate, setRate] = useState(35000);
            const [title, setTitle] = useState('JAM KERJA RIZA SENSEI - FEBRUARI');
            
            const [saveStatus, setSaveStatus] = useState(false);
            const [loadStatus, setLoadStatus] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null); 

            const fileInputRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem('riza_sensei_standalone_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setMeetings(parsed.meetings);
                    setRate(parsed.rate);
                    setTitle(parsed.title);
                }
            }, []);

            const saveLocal = () => {
                localStorage.setItem('riza_sensei_standalone_data', JSON.stringify({ meetings, rate, title }));
                setSaveStatus(true);
                setTimeout(() => setSaveStatus(false), 2000);
            };

            const handleReset = () => {
                const initial = [{ id: Date.now(), label: 'Pertemuan 1', start: '08:00', end: '09:30', isEdited: false }];
                setMeetings(initial);
                localStorage.removeItem('riza_sensei_standalone_data');
                setShowResetConfirm(false);
            };

            const calculateHours = (start, end) => {
                const [h1, m1] = start.split(':').map(Number);
                const [h2, m2] = end.split(':').map(Number);
                const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
                return diff > 0 ? diff / 60 : 0;
            };

            const totalHours = meetings.reduce((sum, m) => sum + calculateHours(m.start, m.end), 0);

            // PENYESUAIAN: Logika auto-end khusus untuk 09:00 dan 09:30 -> 11:30
            const calculateAutoEndTime = (startTime) => {
                if (startTime === '09:00' || startTime === '09:30') {
                    return '11:30';
                }

                const [h, m] = startTime.split(':').map(Number);
                let totalMinutes = h * 60 + m + 90; 
                const newH = Math.floor(totalMinutes / 60);
                const newM = totalMinutes % 60;
                return `${newH.toString().padStart(2, '0')}:${newM.toString().padStart(2, '0')}`;
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setTitle(file.name.replace(/\.[^/.]+$/, ""));

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        const loadedMeetings = [];
                        let honorStr = '';

                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || row.length === 0) continue;

                            const col0 = String(row[0] || '').trim();
                            if (col0 === '' || col0 === 'TOTAL' || col0 === 'KELAS/PERTEMUAN') continue;
                            
                            if (col0 === 'HONOR') {
                                honorStr = String(row[3] || ''); 
                                continue;
                            }

                            loadedMeetings.push({
                                id: Date.now() + i,
                                label: col0,
                                start: String(row[1] || '08:00'),
                                end: String(row[2] || '09:30'),
                                isEdited: true // Data dari Excel dianggap sudah FIX/diedit
                            });
                        }

                        if (loadedMeetings.length > 0) {
                            setMeetings(loadedMeetings);
                            
                            const totalH = loadedMeetings.reduce((sum, m) => sum + calculateHours(m.start, m.end), 0);
                            if (totalH > 0 && honorStr) {
                                const numericHonor = parseInt(honorStr.replace(/[^\d]/g, ''), 10);
                                if (!isNaN(numericHonor)) {
                                    setRate(Math.round(numericHonor / totalH));
                                }
                            }
                            setLoadStatus('success');
                        } else {
                            setLoadStatus('empty');
                        }
                    } catch (error) {
                        setLoadStatus('empty');
                    }
                    
                    setTimeout(() => setLoadStatus(false), 2000);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                };
                reader.readAsArrayBuffer(file);
            };

            const exportExcel = () => {
                const headers = ['KELAS/PERTEMUAN', 'JAM MULAI', 'JAM SELESAI', 'JAM NGAJAR', 'MENIT'];
                
                const dataRows = meetings.map(m => {
                    const d = calculateHours(m.start, m.end);
                    return [m.label, m.start, m.end, Number(d.toFixed(1)), Math.round(d * 60)];
                });
                
                const totalRowIndex = meetings.length + 3; 
                const formulaTotalJam = { t: 'n', f: `E${totalRowIndex}/60` };
                const totalMenitSemua = Math.round(totalHours * 60);

                const worksheetData = [
                    headers,
                    ...dataRows,
                    ['', '', '', '', ''], 
                    ['TOTAL', '', '', formulaTotalJam, totalMenitSemua], 
                    ['HONOR', '', '', `Rp ${ (totalHours * rate).toLocaleString('id-ID') }`, ''] 
                ];

                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Rekap Jam");

                XLSX.writeFile(wb, `${title}.xlsx`);
            };

            const getSafeOptions = (currentValue) => {
                return [...new Set([...TIME_OPTIONS, currentValue])].sort();
            };

            return (
                <div className="max-w-2xl mx-auto p-4 md:pt-10 pb-20">
                    <div className="bg-white rounded-[2rem] shadow-xl shadow-slate-200/60 overflow-hidden border border-white">
                        <div className="bg-indigo-600 p-6 md:p-8 text-white">
                            <input 
                                className="w-full bg-transparent border-none text-xl md:text-2xl font-black focus:ring-0 p-0 mb-1"
                                value={title}
                                onChange={e => setTitle(e.target.value)}
                            />
                            <p className="text-indigo-200 text-xs font-bold uppercase tracking-widest">Kalkulator Mengajar</p>
                        </div>

                        <div className="p-6 md:p-8">
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                    <span className="block text-[10px] font-black text-slate-400 uppercase mb-1">Total Jam</span>
                                    <span className="text-2xl font-black text-indigo-600">{totalHours.toFixed(1)}</span>
                                </div>
                                <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                    <span className="block text-[10px] font-black text-emerald-400 uppercase mb-1">Total Honor</span>
                                    <span className="text-xl font-black text-emerald-600">Rp {(totalHours * rate).toLocaleString('id-ID')}</span>
                                </div>
                            </div>

                            <div className="flex items-center justify-between mb-4 px-2">
                                <h3 className="font-black text-slate-400 text-xs uppercase tracking-widest">Daftar Pertemuan</h3>
                                {showResetConfirm ? (
                                    <div className="flex gap-2">
                                        <button onClick={handleReset} className="text-[10px] font-bold bg-rose-500 text-white px-2 py-1 rounded-lg">HAPUS SEMUA</button>
                                        <button onClick={() => setShowResetConfirm(false)} className="text-[10px] font-bold bg-slate-200 px-2 py-1 rounded-lg text-slate-700">BATAL</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowResetConfirm(true)} className="text-slate-300 hover:text-rose-500 transition-colors" title="Reset Semua Data"><IconRefresh /></button>
                                )}
                            </div>

                            <div className="space-y-3">
                                {meetings.map((m, idx) => {
                                    const dur = calculateHours(m.start, m.end);
                                    
                                    // Pengecekan warna baris (merah muda kalau belum diedit)
                                    const isUnedited = m.isEdited === false;
                                    const rowClasses = isUnedited 
                                        ? "p-4 rounded-2xl border shadow-sm transition-all bg-rose-50 border-rose-200" 
                                        : "p-4 rounded-2xl border shadow-sm transition-all bg-white border-slate-100 hover:border-indigo-100";

                                    return (
                                        <div key={m.id} className={rowClasses}>
                                            <div className="flex justify-between items-start mb-3">
                                                <input 
                                                    className={`font-bold bg-transparent border-none focus:ring-0 p-0 text-sm w-3/4 ${isUnedited ? 'text-rose-900' : 'text-slate-700'}`}
                                                    value={m.label}
                                                    onChange={e => setMeetings(meetings.map(x => x.id === m.id ? {...x, label: e.target.value, isEdited: true} : x))}
                                                />
                                                
                                                {deleteConfirmId === m.id ? (
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => setMeetings(meetings.filter(x => x.id !== m.id))} 
                                                            className="text-[10px] font-bold bg-rose-500 text-white px-2 py-1 rounded-lg"
                                                        >
                                                            Ya, Hapus
                                                        </button>
                                                        <button 
                                                            onClick={() => setDeleteConfirmId(null)} 
                                                            className="text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-lg"
                                                        >
                                                            Batal
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => setDeleteConfirmId(m.id)} className={`${isUnedited ? 'text-rose-300 hover:text-rose-600' : 'text-slate-300 hover:text-rose-500'} transition-colors`}>
                                                        <IconTrash />
                                                    </button>
                                                )}

                                            </div>
                                            <div className="flex items-center gap-2">
                                                <select 
                                                    className={`flex-1 border-none rounded-xl px-3 py-2 text-xs font-bold focus:ring-2 focus:ring-indigo-500 ${isUnedited ? 'bg-white/60 text-rose-700' : 'bg-slate-50 text-slate-700'}`}
                                                    value={m.start}
                                                    onChange={e => {
                                                        const newStart = e.target.value;
                                                        const autoEnd = calculateAutoEndTime(newStart);
                                                        setMeetings(meetings.map(x => x.id === m.id ? {...x, start: newStart, end: autoEnd, isEdited: true} : x));
                                                    }}
                                                >
                                                    {getSafeOptions(m.start).map(t => <option key={t} value={t}>{t}</option>)}
                                                </select>
                                                <span className={`${isUnedited ? 'text-rose-300' : 'text-slate-300'} font-bold`}>-</span>
                                                <select 
                                                    className={`flex-1 border-none rounded-xl px-3 py-2 text-xs font-bold focus:ring-2 focus:ring-indigo-500 ${isUnedited ? 'bg-white/60 text-rose-700' : 'bg-slate-50 text-slate-700'} ${dur <= 0 ? '!text-rose-500' : ''}`}
                                                    value={m.end}
                                                    onChange={e => setMeetings(meetings.map(x => x.id === m.id ? {...x, end: e.target.value, isEdited: true} : x))}
                                                >
                                                    {getSafeOptions(m.end).map(t => <option key={t} value={t}>{t}</option>)}
                                                </select>
                                                <div className="ml-2 text-right min-w-[50px]">
                                                    <span className={`block text-[9px] font-black uppercase ${isUnedited ? 'text-rose-400' : 'text-slate-300'}`}>Durasi</span>
                                                    <span className={`text-xs font-black ${isUnedited ? 'text-rose-600' : 'text-indigo-500'}`}>{dur.toFixed(1)}h</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}

                                <button 
                                    onClick={() => setMeetings([...meetings, { id: Date.now(), label: `Pertemuan ${meetings.length + 1}`, start: '08:00', end: '09:30', isEdited: false }])}
                                    className="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl flex items-center justify-center gap-2 text-slate-400 font-bold hover:bg-slate-50 hover:border-indigo-200 hover:text-indigo-400 transition-all"
                                >
                                    <IconPlus /> Tambah Baris
                                </button>
                            </div>
                        </div>

                        <input 
                            type="file" 
                            accept=".xlsx" 
                            className="hidden" 
                            ref={fileInputRef}
                            onChange={handleFileUpload}
                        />

                        <div className="p-6 bg-slate-50 border-t border-slate-100 flex flex-col gap-3">
                            <div className="flex gap-3">
                                <button 
                                    onClick={() => fileInputRef.current.click()}
                                    className={`flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl font-bold transition-all ${loadStatus === 'success' ? 'bg-indigo-500 text-white' : loadStatus === 'empty' ? 'bg-rose-500 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}`}
                                >
                                    <IconFolder /> {loadStatus === 'success' ? 'Berhasil!' : loadStatus === 'empty' ? 'Gagal Muat' : 'Muat File Excel'}
                                </button>

                                <button 
                                    onClick={saveLocal}
                                    className={`flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl font-bold transition-all ${saveStatus ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}`}
                                    title="Simpan sementara di browser"
                                >
                                    <IconSave /> {saveStatus ? 'Tersimpan' : 'Simpan'}
                                </button>
                            </div>
                            <button 
                                onClick={exportExcel}
                                className="w-full flex items-center justify-center gap-2 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all"
                            >
                                <IconDownload /> Ekspor Excel (.xlsx)
                            </button>
                        </div>
                    </div>
                    
                    <div className="mt-8 text-center space-y-2">
                        <div className="flex items-center justify-center gap-2">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Rate per Jam: Rp</span>
                            <input 
                                type="number" 
                                className="bg-transparent border-none border-b border-slate-200 w-24 text-xs font-bold p-0 focus:ring-0 text-center text-slate-600" 
                                value={rate} 
                                onChange={e => setRate(Number(e.target.value))}
                            />
                        </div>
                        <p className="text-[10px] text-slate-400 font-medium italic">Dibuat khusus untuk Riza Sensei</p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
